<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events examples</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="counter">
      <button class="counter__button" id="minusBtn">-</button>
      <p class="counter__count" id="count">0</p>
      <button class="counter__button" id="plusBtn">+</button>
    </div>

    <div class="password">
      <input
        type="password"
        class="password__input"
        id="password"
        placeholder="Введите пароль"
      />
      <button class="password__btn" id="togglePassword">Показать пароль</button>
    </div>

    <button class="modalBtn" id="openModal">Открыть модальное окно</button>
    <div class="modal" id="modal">
      <div class="modal__content">
        <button class="modal__close" id="closeModal">x</button>
        <div class="modal__body">
          <h2>Hi! This is a modal window</h2>
        </div>
      </div>
    </div>

    <form class="registration-form" id="registrationForm">
      <h2 class="registration-form__title">Регистрация</h2>

      <!-- NAME -->
      <div class="registration-form__field form-field">
        <label for="name" class="form-field__label">Имя пользователя</label>
        <input
          type="text"
          name="name"
          id="name"
          class="form-field__input"
          placeholder="Введите имя"
        />
        <small class="error" id="nameError"></small>
      </div>

      <!-- EMAIL -->
      <div class="registration-form__field form-field">
        <label for="email" class="form-field__label">Email пользователя</label>
        <input
          type="email"
          name="email"
          id="email"
          class="form-field__input"
          placeholder="Введите email"
        />
        <small class="error" id="emailError"></small>
      </div>

      <!-- PASSWORD 1-->
      <div class="registration-form__field form-field">
        <label for="pass" class="form-field__label">Пароль пользователя</label>
        <input
          type="password"
          name="pass"
          id="pass"
          class="form-field__input"
          placeholder="Введите пароль"
        />
        <small class="error" id="passError"></small>
      </div>

      <!-- PASSWORD 2-->
      <div class="registration-form__field form-field">
        <label for="confirmPassword" class="form-field__label"
          >Подтвердите пароль</label
        >
        <input
          type="password"
          name="confirmPassword"
          id="confirmPassword"
          class="form-field__input"
          placeholder="Повторите пароль"
        />
        <small class="error" id="confirmPasswordError"></small>
      </div>

      <!-- AGE -->
      <div class="registration-form__field form-field">
        <label for="age" class="form-field__label">Возраст пользователя</label>
        <input
          type="number"
          name="age"
          id="age"
          min="14"
          max="100"
          class="form-field__input"
          placeholder="Введите возраст"
        />
        <small class="error" id="ageError"></small>
      </div>

      <!-- COUNTRY -->
      <div class="registration-form__field form-field">
        <label for="country" class="form-field__label"
          >Страна пользователя</label
        >
        <select name="country" id="country">
          <option value="">Выберите страну</option>
          <option value="KZ">Казахстан</option>
          <option value="US">США</option>
          <option value="RU">Россия</option>
          <option value="CH">Китай</option>
        </select>
        <small class="error" id="countryError"></small>
      </div>

      <!-- GENDER -->
      <div class="registration-form__field form-field">
        <h3 class="form-field__title">Пол пользователя</h3>

        <div class="form-field__block">
          <label for="genderM" class="form-field__label">
            <input type="radio" name="gender" id="genderM" value="M" />М</label
          >
          <label for="genderF" class="form-field__label">
            <input type="radio" name="gender" id="genderF" value="F" />Ж</label
          >
        </div>

        <small class="error" id="genderError"></small>
      </div>

      <!-- ABOUT -->
      <div class="registration-form__field form-field">
        <label for="about" class="form-field__label">О себе</label>
        <textarea
          name="about"
          id="about"
          class="form-field__input"
          placeholder="Расскажите о себе"
        ></textarea>
        <small class="error" id="aboutError"></small>
      </div>

      <!-- TERMS -->
      <div class="registration-form__field form-field">
        <label for="terms" class="form-field__label">
          <input type="checkbox" name="terms" id="terms" />Согласен на обработку
          данных</label
        >

        <small class="error" id="termsError"></small>
      </div>

      <input type="submit" value="Зарегистироваться" id="registrationBtn" />
      <input type="reset" value="Очистить" id="resetBtn" />
    </form>

    <form class="auth-form" id="authForm">
      <h2 class="auth-form__title">Авторизация</h2>

      <!-- EMAIL -->
      <div class="auth-form__field form-field">
        <label for="emailAuth" class="form-field__label"
          >Email пользователя</label
        >
        <input
          type="email"
          name="emailAuth"
          id="emailAuth"
          class="form-field__input"
          placeholder="Введите email"
        />
      </div>

      <!-- PASSWORD 1-->
      <div class="auth-form__field form-field">
        <label for="passAuth" class="form-field__label"
          >Пароль пользователя</label
        >
        <input
          type="password"
          name="passAuth"
          id="passAuth"
          class="form-field__input"
          placeholder="Введите пароль"
        />
        <small class="auth-form__toggle" id="togglePasswordAuth"
          >Показать пароль</small
        >
      </div>
      <small class="error" id="authError"></small>

      <input type="submit" value="Авторизоваться" id="authBtn" />
    </form>

    <div class="search">
      <h2 class="search__title">Каталог товаров</h2>
      <input
        type="text"
        id="searchInput"
        class="search__input"
        placeholder="Поиск по названию или описанию..."
      />

      <div id="products" class="products-block"></div>
    </div>
  </body>
</html>
